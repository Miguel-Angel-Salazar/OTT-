name: CI/CD Pipeline - Plataforma OTT (Cinefilo)

on:
  push:
    branches: [ "main", "docker-integration", "frontend" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

env:
  BACKEND_IMAGE: miguelsalazar22/ott-backend
  FRONTEND_IMAGE: miguelsalazar22/ott-frontend
  APP_VERSION: "1.0.0"

jobs:
  # =========================================================================
  # JOB 1: Integración Continua (CI) - Pruebas Unitarias y de Integración BD
  # =========================================================================
  unit-and-integration-tests:
    name: "1. CI: Pruebas Unitarias e Integración (Flask + PostgreSQL)"
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ott_user
          POSTGRES_PASSWORD: ott_password
          POSTGRES_DB: ott_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U ott_user -d ott_db"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=5

    env:
      DATABASE_URL: postgresql://ott_user:ott_password@localhost:5432/ott_db
      SECRET_KEY: ci_test_secret_key_ott

    steps:
      - name: Checkout del código fuente
        uses: actions/checkout@v4

      - name: Configurar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Instalar dependencias del Backend y Pytest
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install pytest

      - name: Inicializar esquema y datos semilla en PostgreSQL (init.sql)
        env:
          PGPASSWORD: ott_password
        run: |
          psql -h localhost -U ott_user -d ott_db -f database/init.sql

      - name: Ejecutar Pruebas Unitarias (test_unit.py - 10 pruebas)
        run: |
          python -m unittest discover tests -p "test_unit.py" -v

      - name: Ejecutar Pruebas de Integración Backend <-> PostgreSQL (test_flow.py - 4 pruebas)
        run: |
          python -m unittest tests/test_flow.py -v

  # =========================================================================
  # JOB 2: Construcción de Imágenes Docker, Versionado por SHA y Publicación
  # Bloqueado automáticamente si falla el Job 1 (Control de Fallos - D2)
  # =========================================================================
  docker-build-and-traceability:
    name: "2. Docker Build, Tagging (SHA/Version) & Release"
    runs-on: ubuntu-latest
    needs: unit-and-integration-tests
    if: success()

    # Los secretos no se pueden usar directamente en un "if:" de un paso;
    # se exponen como variables de entorno del job y se evalúa env.*
    env:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}

    steps:
      - name: Checkout del código fuente
        uses: actions/checkout@v4

      - name: Generar etiquetas trazables (Commit SHA + Versión Semántica)
        id: vars
        run: |
          SHORT_SHA=$(git rev-parse --short HEAD)
          echo "short_sha=${SHORT_SHA}" >> $GITHUB_OUTPUT
          echo "=== TRAZABILIDAD DE ARTEFACTOS ==="
          echo "Commit completo : ${GITHUB_SHA}"
          echo "Tag por SHA     : sha-${SHORT_SHA}"
          echo "Tag de versión  : v${APP_VERSION}"

      - name: Construir imagen Docker del Backend (Flask)
        run: |
          docker build \
            -t ${{ env.BACKEND_IMAGE }}:v${{ env.APP_VERSION }} \
            -t ${{ env.BACKEND_IMAGE }}:sha-${{ steps.vars.outputs.short_sha }} \
            -t ${{ env.BACKEND_IMAGE }}:latest \
            ./backend

      - name: Construir imagen Docker del Frontend (Nginx)
        run: |
          docker build \
            -t ${{ env.FRONTEND_IMAGE }}:v${{ env.APP_VERSION }} \
            -t ${{ env.FRONTEND_IMAGE }}:sha-${{ steps.vars.outputs.short_sha }} \
            -t ${{ env.FRONTEND_IMAGE }}:latest \
            ./frontend

      - name: Verificar imágenes construidas y validar manifiestos K8s
        run: |
          echo "=== IMÁGENES CONSTRUIDAS Y ETIQUETADAS ==="
          docker images | grep -E "ott-backend|ott-frontend"
          echo "=== VALIDACIÓN DE MANIFIESTOS KUBERNETES (k8s/) ==="
          python3 -c "import yaml" 2>/dev/null || sudo apt-get install -y python3-yaml
          python3 - <<'PY'
          import glob, sys, yaml
          errores = 0
          for f in sorted(glob.glob("k8s/*.yaml")):
              docs = [d for d in yaml.safe_load_all(open(f)) if d]
              print(f"{f}: " + ", ".join(f"{d['kind']}/{d['metadata']['name']}" for d in docs))
              for d in docs:
                  if not d.get("apiVersion") or not d.get("kind"):
                      print(f"  ERROR: documento sin apiVersion/kind en {f}"); errores += 1
          sys.exit(1 if errores else 0)
          PY
          echo "=== COHERENCIA TAG CI <-> MANIFIESTO ==="
          grep -q "image: ${{ env.BACKEND_IMAGE }}:v${{ env.APP_VERSION }}" k8s/04-backend.yaml
          grep -q "image: ${{ env.FRONTEND_IMAGE }}:v${{ env.APP_VERSION }}" k8s/05-frontend.yaml
          echo "OK: k8s/ despliega exactamente v${{ env.APP_VERSION }}, la versión construida por este pipeline"

      - name: Publicar en Docker Hub (si secretos DOCKERHUB están configurados)
        if: ${{ env.DOCKERHUB_USERNAME != '' && env.DOCKERHUB_TOKEN != '' }}
        run: |
          echo "$DOCKERHUB_TOKEN" | docker login -u "$DOCKERHUB_USERNAME" --password-stdin
          TARGET_BACKEND="${DOCKERHUB_USERNAME}/ott-backend"
          TARGET_FRONTEND="${DOCKERHUB_USERNAME}/ott-frontend"
          docker tag ${{ env.BACKEND_IMAGE }}:v${{ env.APP_VERSION }} ${TARGET_BACKEND}:v${{ env.APP_VERSION }}
          docker tag ${{ env.BACKEND_IMAGE }}:v${{ env.APP_VERSION }} ${TARGET_BACKEND}:sha-${{ steps.vars.outputs.short_sha }}
          docker tag ${{ env.BACKEND_IMAGE }}:v${{ env.APP_VERSION }} ${TARGET_BACKEND}:latest
          docker tag ${{ env.FRONTEND_IMAGE }}:v${{ env.APP_VERSION }} ${TARGET_FRONTEND}:v${{ env.APP_VERSION }}
          docker tag ${{ env.FRONTEND_IMAGE }}:v${{ env.APP_VERSION }} ${TARGET_FRONTEND}:sha-${{ steps.vars.outputs.short_sha }}
          docker tag ${{ env.FRONTEND_IMAGE }}:v${{ env.APP_VERSION }} ${TARGET_FRONTEND}:latest
          docker push ${TARGET_BACKEND}:v${{ env.APP_VERSION }}
          docker push ${TARGET_BACKEND}:sha-${{ steps.vars.outputs.short_sha }}
          docker push ${TARGET_BACKEND}:latest
          docker push ${TARGET_FRONTEND}:v${{ env.APP_VERSION }}
          docker push ${TARGET_FRONTEND}:sha-${{ steps.vars.outputs.short_sha }}
          docker push ${TARGET_FRONTEND}:latest

      - name: Resumen de trazabilidad (Commit -> Imagen -> Manifiesto)
        if: always()
        run: |
          {
            echo "## Trazabilidad de la entrega"
            echo ""
            echo "| Elemento | Valor |"
            echo "|---|---|"
            echo "| Commit | \`${GITHUB_SHA}\` |"
            echo "| Rama | \`${GITHUB_REF_NAME}\` |"
            echo "| Imagen backend | \`${{ env.BACKEND_IMAGE }}:v${{ env.APP_VERSION }}\` y \`sha-${{ steps.vars.outputs.short_sha }}\` |"
            echo "| Imagen frontend | \`${{ env.FRONTEND_IMAGE }}:v${{ env.APP_VERSION }}\` y \`sha-${{ steps.vars.outputs.short_sha }}\` |"
            echo "| Manifiestos | \`k8s/04-backend.yaml\`, \`k8s/05-frontend.yaml\` (v${{ env.APP_VERSION }}) |"
            if [ -n "$DOCKERHUB_USERNAME" ]; then
              echo "| Docker Hub | publicado |"
            else
              echo "| Docker Hub | omitido: faltan los secretos DOCKERHUB_USERNAME / DOCKERHUB_TOKEN |"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
