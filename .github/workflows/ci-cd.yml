name: CI/CD Pipeline - Plataforma OTT (Cinefilo)

on:
  push:
    branches: [ "main", "docker-integration", "frontend" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

env:
  BACKEND_IMAGE: juanexzz/ott-backend
  FRONTEND_IMAGE: juanexzz/ott-frontend
  APP_VERSION: "1.0.0"

jobs:
  # =========================================================================
  # JOB 1: Integración Continua (CI) - Pruebas Unitarias y de Integración BD
  # =========================================================================
  unit-and-integration-tests:
    name: "1. CI: Pruebas Unitarias e Integración (Flask + PostgreSQL)"
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ott_user
          POSTGRES_PASSWORD: ott_password
          POSTGRES_DB: ott_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U ott_user -d ott_db"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=5

    env:
      DATABASE_URL: postgresql://ott_user:ott_password@localhost:5432/ott_db
      SECRET_KEY: ci_test_secret_key_ott

    steps:
      - name: Checkout del código fuente
        uses: actions/checkout@v4

      - name: Configurar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Instalar dependencias del Backend y Pytest
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install pytest

      - name: Inicializar esquema y datos semilla en PostgreSQL (init.sql)
        env:
          PGPASSWORD: ott_password
        run: |
          psql -h localhost -U ott_user -d ott_db -f database/init.sql

      - name: Ejecutar Pruebas Unitarias (test_unit.py - 10 pruebas)
        run: |
          python -m unittest discover tests -p "test_unit.py" -v

      - name: Ejecutar Pruebas de Integración Backend <-> PostgreSQL (test_flow.py - 4 pruebas)
        run: |
          python -m unittest tests/test_flow.py -v

  # =========================================================================
  # JOB 2: Construcción de Imágenes Docker, Versionado por SHA y Publicación
  # Bloqueado automáticamente si falla el Job 1 (Control de Fallos - D2)
  # =========================================================================
  docker-build-and-traceability:
    name: "2. Docker Build, Tagging (SHA/Version) & Release"
    runs-on: ubuntu-latest
    needs: unit-and-integration-tests
    if: success()

    steps:
      - name: Checkout del código fuente
        uses: actions/checkout@v4

      - name: Generar etiquetas trazables (Commit SHA + Versión Semántica)
        id: vars
        run: |
          SHORT_SHA=$(git rev-parse --short HEAD)
          echo "short_sha=${SHORT_SHA}" >> $GITHUB_OUTPUT
          echo "=== TRAZABILIDAD DE ARTEFACTOS ==="
          echo "Commit completo : ${GITHUB_SHA}"
          echo "Tag por SHA     : sha-${SHORT_SHA}"
          echo "Tag de versión  : v${APP_VERSION}"

      - name: Construir imagen Docker del Backend (Flask)
        run: |
          docker build \
            -t ${{ env.BACKEND_IMAGE }}:v${{ env.APP_VERSION }} \
            -t ${{ env.BACKEND_IMAGE }}:sha-${{ steps.vars.outputs.short_sha }} \
            -t ${{ env.BACKEND_IMAGE }}:latest \
            ./backend

      - name: Construir imagen Docker del Frontend (Nginx)
        run: |
          docker build \
            -t ${{ env.FRONTEND_IMAGE }}:v${{ env.APP_VERSION }} \
            -t ${{ env.FRONTEND_IMAGE }}:sha-${{ steps.vars.outputs.short_sha }} \
            -t ${{ env.FRONTEND_IMAGE }}:latest \
            ./frontend

      - name: Verificar imágenes construidas y validar manifiestos K8s
        run: |
          echo "=== IMÁGENES CONSTRUIDAS Y ETIQUETADAS ==="
          docker images | grep -E "ott-backend|ott-frontend"
          echo "=== MANIFIESTOS KUBERNETES VERSIONADOS ==="
          ls -la k8s/

      - name: Publicar en Docker Hub (si secretos DOCKERHUB están configurados)
        if: ${{ secrets.DOCKERHUB_USERNAME != '' && secrets.DOCKERHUB_TOKEN != '' }}
        run: |
          echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login -u "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin
          docker push ${{ env.BACKEND_IMAGE }}:v${{ env.APP_VERSION }}
          docker push ${{ env.BACKEND_IMAGE }}:sha-${{ steps.vars.outputs.short_sha }}
          docker push ${{ env.BACKEND_IMAGE }}:latest
          docker push ${{ env.FRONTEND_IMAGE }}:v${{ env.APP_VERSION }}
          docker push ${{ env.FRONTEND_IMAGE }}:sha-${{ steps.vars.outputs.short_sha }}
          docker push ${{ env.FRONTEND_IMAGE }}:latest
