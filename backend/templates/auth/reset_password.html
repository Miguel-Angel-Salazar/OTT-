<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>Restablecer contraseña</title>
</head>

<body>

    <h1>Restablecer contraseña</h1>

    <p>
        Ingresa tu nueva contraseña.
    </p>

    <form action="{{ url_for('auth.reset_password') }}" method="POST">

        <label for="password">
            Nueva contraseña
        </label><br>

        <input
            type="password"
            id="password"
            name="password"
            required
        >

        <br><br>

        <label for="confirm_password">
            Confirmar nueva contraseña
        </label><br>

        <input
            type="password"
            id="confirm_password"
            name="confirm_password"
            required
        >

        <br><br>

        <button type="submit">
            Cambiar contraseña
        </button>

    </form>

    {% if mensaje %}
        <p>{{ mensaje }}</p>
    {% endif %}

    <br>

    <a href="{{ url_for('auth.login') }}">
        Volver al inicio de sesión
    </a>

</body>

</html>
