{% extends "base.html" %}

{% block title %}Crear cuenta — OTT{% endblock %}

{% block extra_css %}
    <link rel="stylesheet" href="{{ url_for('static', filename='css/auth.css') }}">
{% endblock %}

{% block content %}
<section class="auth-page">
    <div class="auth-card">
        <h1 class="auth-card__title">Crear cuenta</h1>
        <p class="auth-card__subtitle">Regístrate para empezar a ver</p>

        <form class="auth-form" action="{{ url_for('auth.register') }}" method="POST">
            <div class="form-group">
                <label for="nombre">Nombre</label>
                <input type="text" id="nombre" name="nombre" required>
            </div>

            <div class="form-group">
                <label for="email">Correo</label>
                <input type="email" id="email" name="email" required>
            </div>

            <div class="form-group">
                <label for="password">Contraseña</label>
                <input type="password" id="password" name="password" required>
            </div>

            <div class="form-group">
                <label for="region">Región</label>
                <select id="region" name="region">
                    <option value="LATAM">LATAM</option>
                    <option value="USA">USA</option>
                    <option value="EUROPA">EUROPA</option>
                </select>
            </div>

            <button type="submit" class="btn btn-primary auth-form__submit">
                Crear cuenta
            </button>
        </form>

        {% if mensaje %}
            <p class="form-message">{{ mensaje }}</p>
        {% endif %}

        <p class="auth-card__footer">
            ¿Ya tienes cuenta?
            <a href="{{ url_for('auth.login') }}">Inicia sesión</a>
        </p>
    </div>
</section>
{% endblock %}
