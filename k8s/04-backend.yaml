apiVersion: apps/v1
kind: Deployment
metadata:
  name: ott-backend
  namespace: ott-platform
  labels:
    app: ott-backend
    tier: backend
    app.kubernetes.io/version: "1.0.0"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ott-backend
  template:
    metadata:
      labels:
        app: ott-backend
        tier: backend
        app.kubernetes.io/version: "1.0.0"
    spec:
      containers:
        - name: backend
          image: juanexzz/ott-backend:v1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5000
              name: http
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: ott-secrets
                  key: DATABASE_URL
            - name: SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: ott-secrets
                  key: SECRET_KEY
            - name: PORT
              valueFrom:
                configMapKeyRef:
                  name: ott-config
                  key: PORT
            - name: FLASK_DEBUG
              valueFrom:
                configMapKeyRef:
                  name: ott-config
                  key: FLASK_DEBUG
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          readinessProbe:
            httpGet:
              path: /api/health
              port: 5000
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /api/health
              port: 5000
            initialDelaySeconds: 15
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: ott-backend
  namespace: ott-platform
  labels:
    app: ott-backend
spec:
  type: ClusterIP
  ports:
    - port: 5000
      targetPort: 5000
      protocol: TCP
      name: http
  selector:
    app: ott-backend
