apiVersion: apps/v1
kind: Deployment
metadata:
  name: ott-frontend
  namespace: ott-platform
  labels:
    app: ott-frontend
    tier: frontend
    app.kubernetes.io/version: "1.0.0"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ott-frontend
  template:
    metadata:
      labels:
        app: ott-frontend
        tier: frontend
        app.kubernetes.io/version: "1.0.0"
    spec:
      containers:
        - name: frontend
          image: juanexzz/ott-frontend:v1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
              name: http
          env:
            - name: BACKEND_URL
              valueFrom:
                configMapKeyRef:
                  name: ott-config
                  key: BACKEND_URL
            - name: NGINX_ENVSUBST_FILTER
              value: "BACKEND_URL"
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "300m"
              memory: "256Mi"
          readinessProbe:
            httpGet:
              path: /auth/login
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /auth/login
              port: 80
            initialDelaySeconds: 15
            periodSeconds: 15
            timeoutSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: ott-frontend
  namespace: ott-platform
  labels:
    app: ott-frontend
spec:
  type: NodePort
  ports:
    - port: 80
      targetPort: 80
      nodePort: 30080
      protocol: TCP
      name: http
  selector:
    app: ott-frontend
