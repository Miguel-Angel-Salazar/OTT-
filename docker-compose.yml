services:
  db:
    image: postgres:16-alpine
    container_name: ott-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ott_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ott_password}
      POSTGRES_DB: ${POSTGRES_DB:-ott_db}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ott_user} -d ${POSTGRES_DB:-ott_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    image: juanexzz/ott-backend:latest
    container_name: ott-backend
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://ott_user:ott_password@db:5432/ott_db}
      SECRET_KEY: ${SECRET_KEY:-super_secret_mubi_ott_key_change_me}
      PORT: ${BACKEND_PORT:-5000}
    ports:
      - "${BACKEND_PORT:-5000}:5000"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    image: juanexzz/ott-frontend:latest
    container_name: ott-frontend
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      BACKEND_URL: ${BACKEND_URL:-http://backend:5000}
    ports:
      - "${FRONTEND_PORT:-80}:80"
    depends_on:
      - backend

volumes:
  postgres_data:
